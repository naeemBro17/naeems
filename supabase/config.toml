# steadfast-refresh-all is called by our own pg_cron job (migration-026),
# which sends our custom STEADFAST_CRON_REFRESH_SECRET as the Authorization
# header, not a real Supabase-signed JWT. Supabase's gateway would 401 every
# cron call before the function's own secret check ever runs unless JWT
# verification is off for this one function. The function still checks its
# own secret internally — this only disables the platform's separate check.
[functions.steadfast-refresh-all]
verify_jwt = false

# Batch 31 Part 1: called by the nightly backup GitHub Action, which has no
# Supabase login. The function checks its own BACKUP_ALERT_SECRET instead.
[functions.backup-alert]
verify_jwt = false

# Batch 34 Part 3: called by the orders trigger (migration-036), which sends
# a random shared secret from Vault in x-notify-secret — not a Supabase
# login token. The function checks that secret itself (constant time) and
# refuses everything else with 401.
[functions.notify-telegram-order]
verify_jwt = false
