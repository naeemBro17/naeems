<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme choice before first paint to avoid a flash.
      try {
        var storedTheme = localStorage.getItem('theme');
        if (storedTheme === 'dark' || storedTheme === 'light') {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch (e) {}
    </script>
    <script>
      // Batch 29: on Home, the banner photo is the biggest thing on the first
      // screen, but the app only learns its address after its own code and
      // the shop's data have loaded. Ask for the banner list right away and
      // let the browser start downloading the first photo in parallel. Any
      // failure just means the app loads it the normal way, a bit later.
      (function () {
        if (location.pathname !== '/' || !window.fetch) return;
        // The public key goes in the address, not a header, so the browser
        // can send this at once without an extra permission round-trip.
        fetch('%VITE_SUPABASE_URL%/rest/v1/app_settings?select=value&key=eq.banner_slides&apikey=%VITE_SUPABASE_ANON_KEY%')
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (rows) {
            var slides = JSON.parse((rows[0] && rows[0].value) || '[]');
            for (var i = 0; i < slides.length; i += 1) {
              var slide = slides[i];
              if (!slide || slide.is_active === false) continue;
              if (!slide.image_url) return;
              var link = document.createElement('link');
              link.rel = 'preload';
              link.as = 'image';
              link.href = slide.image_url;
              link.setAttribute('fetchpriority', 'high');
              document.head.appendChild(link);
              return;
            }
          })
          .catch(function () {});
      })();
    </script>
    <meta name="description" content="Authentic Australian skincare imported to Bangladesh. Browse prices and order directly via WhatsApp." />
    <meta property="og:site_name" content="NAEEM'S" />
    <meta property="og:title" content="NAEEM'S" />
    <meta property="og:description" content="Premium Australian skincare — check prices instantly" />
    <meta property="og:image" content="https://naeems-all.vercel.app/og-image.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naeems-all.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NAEEM'S" />
    <meta name="twitter:description" content="Premium Australian skincare — check prices instantly" />
    <meta name="twitter:image" content="https://naeems-all.vercel.app/og-image.png" />
    <link rel="canonical" href="https://naeems-all.vercel.app/" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Batch 29: start talking to the shop's database and the font server
         before the app asks (saves a round-trip on a slow phone). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the first paint (font-display: swap —
         the system font shows first, then swaps). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap"
      />
    </noscript>
    <title>NAEEM'S</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
