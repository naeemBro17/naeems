<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NAEEM'S Orb demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#1c1c1e;--mu:#8e8e93;--line:#e5e5ea;--soft:#f2f2f5;--acc:#ff7a45;--me:#1c1c1e;--meTx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#a1a1a6;--line:#38383a;--soft:#2c2c2e;--me:#f2f2f7;--meTx:#000}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mu:#a1a1a6;--line:#38383a;--soft:#2c2c2e;--me:#f2f2f7;--meTx:#000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Plus Jakarta Sans","Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden}
.page{padding:20px 16px;max-width:520px;margin:0 auto}
.page h1{font-size:20px}.page p{color:var(--mu);font-size:14px;margin-top:6px;line-height:1.5}
.theme{margin-top:14px;display:inline-flex;gap:6px}.theme button{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx)}

/* the character */
.ch{position:relative;display:inline-block}
.ch svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.ch .orb{transition:transform .32s cubic-bezier(.3,1.4,.5,1),opacity .2s;transform-origin:50% 50%}
.ch .pet{transition:transform .38s cubic-bezier(.3,1.3,.5,1),opacity .2s;transform-origin:50% 50%;transform:scale(0) rotate(-90deg);opacity:0}
.ch.think .orb{transform:scale(0);opacity:0}
.ch.think .pet{transform:scale(1) rotate(0);opacity:1}
.ch.think .spin{animation:spin 1.8s cubic-bezier(.6,0,.4,1) infinite;transform-origin:32px 32px}
.ch.think .p{animation:breathe 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.ch.think g:nth-child(2) .p{animation-delay:.12s}.ch.think g:nth-child(3) .p{animation-delay:.24s}.ch.think g:nth-child(4) .p{animation-delay:.36s}.ch.think g:nth-child(5) .p{animation-delay:.48s}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.ch.hello .eyes{animation:blink2 .5s 1}
.ch .bob{animation:bob 3.4s ease-in-out infinite;transform-origin:32px 32px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{transform:scale(.62)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes blink2{50%{transform:scaleY(.1)}}
@keyframes bob{50%{transform:translateY(-2px)}}

/* floating ball */
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(255,122,69,.35));z-index:5}
.fab .ch{width:64px;height:64px}
.tipb{position:fixed;right:90px;bottom:calc(40px + env(safe-area-inset-bottom));background:var(--card);border:1px solid var(--line);padding:8px 12px;border-radius:14px 14px 4px 14px;font-size:13px;box-shadow:0 4px 14px rgba(0,0,0,.08);z-index:5}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .25s;z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;height:86vh;background:var(--card);border-radius:22px 22px 0 0;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);z-index:9;display:flex;flex-direction:column}
.open .scrim{opacity:1;pointer-events:auto}.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px}
.hd{display:flex;align-items:center;gap:10px;padding:8px 14px 12px;border-bottom:1px solid var(--line)}
.hd .ch{width:36px;height:36px}
.hd .nm{font-weight:700;font-size:16px}.hd .sb{font-size:12px;color:var(--mu)}
.x{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--tx);font-size:18px;cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px;font-family:"Hind Siliguri","Plus Jakarta Sans",sans-serif}
.me{align-self:flex-end;max-width:80%;background:var(--me);color:var(--meTx);padding:10px 14px;border-radius:18px 18px 4px 18px;font-size:15.5px;line-height:1.45}
.bot{display:flex;gap:10px;align-items:flex-start;max-width:92%}
.bot .ch{width:28px;height:28px;flex:none;margin-top:2px}
.bot .tx{font-size:15.5px;line-height:1.6}
.bot .tx b{font-weight:700}
.thinking{display:flex;gap:10px;align-items:center;color:var(--mu);font-size:14px}
.thinking .ch{width:28px;height:28px}
.shine{background:linear-gradient(90deg,var(--mu) 0 40%,var(--acc) 50%,var(--mu) 60% 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.5s linear infinite}
@keyframes sh{from{background-position:100% 0}to{background-position:-150% 0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 0 38px}
.chip{font:inherit;font-size:13.5px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--tx);cursor:pointer}
.in{display:flex;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.in input{flex:1;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--tx);outline:none}
.in input:focus-visible{border-color:var(--acc)}
.send{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:20px;cursor:pointer}
.send:disabled{opacity:.4}
.note{font-size:11.5px;color:var(--mu);text-align:center;padding:0 0 6px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

<template id="chT">
<span class="ch"><svg viewBox="0 0 64 64">
 <defs><radialGradient id="G" cx="35%" cy="30%"><stop offset="0" stop-color="#ffc2a8"/><stop offset=".55" stop-color="#ff7a45"/><stop offset="1" stop-color="#e5602c"/></radialGradient></defs>
 <g class="orb"><g class="bob"><circle cx="32" cy="32" r="26" fill="url(#G)"/><ellipse cx="23" cy="21" rx="7" ry="4" fill="#fff" opacity=".5" transform="rotate(-25 23 21)"/><g class="eyes"><ellipse cx="25" cy="33" rx="3.3" ry="4.4" fill="#2a1408"/><ellipse cx="39" cy="33" rx="3.3" ry="4.4" fill="#2a1408"/></g></g></g>
 <g class="pet"><g class="spin">
  <g transform="rotate(0 32 32)"><path class="p" d="M32 32C21 25 22 9 32 6C42 9 43 25 32 32z" fill="#ff7a45"/></g>
  <g transform="rotate(72 32 32)"><path class="p" d="M32 32C21 25 22 9 32 6C42 9 43 25 32 32z" fill="#ff8f60"/></g>
  <g transform="rotate(144 32 32)"><path class="p" d="M32 32C21 25 22 9 32 6C42 9 43 25 32 32z" fill="#ffa47c"/></g>
  <g transform="rotate(216 32 32)"><path class="p" d="M32 32C21 25 22 9 32 6C42 9 43 25 32 32z" fill="#ff8f60"/></g>
  <g transform="rotate(288 32 32)"><path class="p" d="M32 32C21 25 22 9 32 6C42 9 43 25 32 32z" fill="#ff7a45"/></g>
 </g></g>
</svg></span>
</template>

<div class="page">
 <h1>NAEEM'S Orb: chat demo</h1>
 <p>Tap the orange ball. Type anything (Bangla or English). While it "thinks", the ball turns into the flower, then comes back. Replies are pre-written for this demo.</p>
 <div class="theme"><button onclick="setT('light')">Light</button><button onclick="setT('dark')">Dark</button><button onclick="setT('')">Auto</button></div>
</div>

<div class="tipb" id="tip">হ্যালো! আমাকে টিপ দিন</div>
<button class="fab" id="fab" aria-label="Open chat"></button>

<div id="root">
 <div class="scrim" id="scrim"></div>
 <div class="sheet" role="dialog" aria-label="NAEEM'S Helper">
  <div class="grab"></div>
  <div class="hd"><span id="hdc"></span><div><div class="nm">NAEEM'S Helper</div><div class="sb">Usually replies instantly</div></div><button class="x" id="x" aria-label="Close">×</button></div>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="note">Demo: replies are pre-written</div>
  <form class="in" id="f"><input id="q" placeholder="Message NAEEM'S Helper" autocomplete="off"><button class="send" id="s" aria-label="Send">↑</button></form>
 </div>
</div>

<script>
const T=document.getElementById('chT');let uid=0;
function ch(){const n=T.content.firstElementChild.cloneNode(true);const id='G'+(uid++);n.querySelector('radialGradient').id=id;n.querySelector('circle').setAttribute('fill','url(#'+id+')');return n}
function setT(t){t?document.documentElement.setAttribute('data-theme',t):document.documentElement.removeAttribute('data-theme')}
const fab=document.getElementById('fab');fab.appendChild(ch());
document.getElementById('hdc').appendChild(ch());
const root=document.getElementById('root'),msgs=document.getElementById('msgs'),q=document.getElementById('q'),s=document.getElementById('s');
let opened=false,busy=false;
function open(){root.classList.add('open');document.getElementById('tip').style.display='none';if(!opened){opened=true;setTimeout(()=>bot('আসসালামু আলাইকুম! আমি <b>NAEEM\'S Helper</b>। স্কিনকেয়ার, দাম, ডেলিভারি বা অর্ডার নিয়ে যা খুশি জিজ্ঞেস করুন।',['সানস্ক্রিন সাজেস্ট করো','ডেলিভারি চার্জ কত?','আমার অর্ডার কোথায়?']),350)}setTimeout(()=>q.focus(),400)}
function close(){root.classList.remove('open')}
fab.onclick=open;document.getElementById('x').onclick=close;document.getElementById('scrim').onclick=close;
function scroll(){msgs.scrollTop=msgs.scrollHeight}
function me(t){const d=document.createElement('div');d.className='me';d.textContent=t;msgs.appendChild(d);scroll()}
function bot(html,chips){const w=document.createElement('div');w.className='bot';const c=ch();c.classList.add('hello');w.appendChild(c);const t=document.createElement('div');t.className='tx';w.appendChild(t);msgs.appendChild(w);
 let i=0;const plain=html;const step=()=>{i=Math.min(plain.length,i+3);let cut=plain.slice(0,i);if((cut.match(/</g)||[]).length>(cut.match(/>/g)||[]).length){i=plain.indexOf('>',i)+1;cut=plain.slice(0,i)}t.innerHTML=cut;scroll();if(i<plain.length)setTimeout(step,16);else if(chips){const cw=document.createElement('div');cw.className='chips';chips.forEach(x=>{const b=document.createElement('button');b.className='chip';b.textContent=x;b.onclick=()=>{cw.remove();send(x)};cw.appendChild(b)});msgs.appendChild(cw);scroll()}};step()}
function think(){const d=document.createElement('div');d.className='thinking';const c=ch();d.appendChild(c);const sp=document.createElement('span');sp.className='shine';sp.textContent='ভাবছি…';d.appendChild(sp);msgs.appendChild(d);scroll();
 const hd=document.querySelector('.hd .ch');requestAnimationFrame(()=>{c.classList.add('think')});return {d,c,hd}}
const R=[
 [/^(hi|hello|hey|হাই|হ্যালো|হেলো|সালাম|আসসালামু|assalam)/i,['হ্যালো! 😊 কীভাবে সাহায্য করতে পারি? আপনার স্কিন টাইপ বললে আমি মানানসই প্রোডাক্ট সাজেস্ট করতে পারি।',['আমার স্কিন অয়েলি','আমার স্কিন ড্রাই','ব্রণ সমস্যা']]],
 [/(sunscreen|সানস্ক্রিন|spf|রোদ)/i,['সানস্ক্রিনের জন্য আমার পছন্দ:<br>• <b>Oily skin:</b> হালকা gel-type, SPF 50+<br>• <b>Dry skin:</b> moisturising cream-type<br>• প্রতি ২–৩ ঘণ্টা পরপর আবার লাগাবেন।<br>আপনার স্কিন টাইপ কী?',['অয়েলি','ড্রাই','সেনসিটিভ']]],
 [/(delivery|ডেলিভারি|চার্জ|charge|কবে পাব|কত দিন)/i,['ঢাকার ভেতরে ডেলিভারি <b>১–২ দিনে</b>, ঢাকার বাইরে <b>২–৪ দিনে</b>। Steadfast Courier দিয়ে পাঠাই, পার্সেল ট্র্যাকও করতে পারবেন। চার্জ চেকআউটে আপনার ঠিকানা অনুযায়ী দেখাবে।']],
 [/(order|অর্ডার|পার্সেল|parcel|track|কোথায়)/i,['আপনার অর্ডার নম্বর (যেমন NM-1979) দিন, আমি দেখে বলছি কোথায় আছে। অথবা <b>My orders</b> থেকে সরাসরি ট্র্যাক করতে পারেন।']],
 [/^nm-?\d+/i,['পেয়েছি! আপনার অর্ডারটি এখন <b>In transit</b>, আপনার এলাকার হাবে পৌঁছে গেছে। আশা করি আজ-কালের মধ্যেই পেয়ে যাবেন। 🚚']],
 [/(acne|pimple|ব্রণ|ব্রন|ফুসকুড়ি)/i,['ব্রণের জন্য শুরু করতে পারেন:<br>• <b>Salicylic acid</b> ক্লিনজার (রোমকূপ পরিষ্কার রাখে)<br>• <b>Niacinamide</b> সিরাম (তেল আর দাগ কমায়)<br>• ভারী ক্রিম এড়িয়ে চলুন<br>সমস্যা বেশি হলে Naeem ভাইয়ের সাথে পরামর্শ নিতে পারেন।',['Niacinamide দেখাও','কনসাল্ট বুক করো']]],
 [/(oily|অয়েলি|তেল)/i,['অয়েলি স্কিনের জন্য: হালকা gel moisturiser, niacinamide সিরাম আর gel-type সানস্ক্রিন সবচেয়ে ভালো কাজ করে। CeraVe Foaming Cleanser দিয়ে শুরু করতে পারেন।']],
 [/(dry|ড্রাই|শুষ্ক|রুক্ষ)/i,['ড্রাই স্কিনের জন্য: ক্রিম-বেসড ক্লিনজার, hyaluronic acid আর ceramide যুক্ত ময়েশ্চারাইজার। CeraVe Moisturising Cream অনেকের প্রিয়।']],
 [/(sensitive|সেনসিটিভ|লাল|জ্বালা)/i,['সেনসিটিভ স্কিনে সুগন্ধিহীন আর হালকা প্রোডাক্ট বেছে নিন। নতুন কিছু লাগানোর আগে হাতের ভেতরে ২৪ ঘণ্টা প্যাচ টেস্ট করে নেবেন।']],
 [/(price|দাম|কত টাকা|offer|অফার|discount|ছাড়)/i,['সব দাম প্রোডাক্ট পেজে লেখা আছে, অফার থাকলে কমলা রঙে দেখায়। কোন প্রোডাক্টের দাম জানতে চান?']],
 [/(original|আসল|authentic|নকল|fake)/i,['আমাদের সব প্রোডাক্ট সরাসরি <b>অস্ট্রেলিয়া</b> থেকে আনা, ১০০% অরিজিনাল। প্রতিটা প্রোডাক্টের পেজে রিভিউ ভিডিও আছে।']],
 [/(thanks|thank|ধন্যবাদ|thx)/i,['আপনাকেও ধন্যবাদ! 🧡 আর কিছু লাগলে জানাবেন।']],
 [/(kemon|কেমন আছ|how are)/i,['আলহামদুলিল্লাহ ভালো! আপনার স্কিন কেমন আছে আজ? 😄']],
 [/(nia|নাম কি|তোমার নাম|who are you|তুমি কে)/i,['আমি NAEEM\'S-এর ছোট্ট সাহায্যকারী। আমার কাজ আপনার স্কিনকেয়ারের প্রশ্নের উত্তর খুঁজে দেওয়া। 🟠']],
];
const FB=['ভালো প্রশ্ন! এটার সঠিক উত্তরের জন্য Naeem ভাইয়ের সাথে সরাসরি কথা বলাই ভালো হবে।',['WhatsApp-এ কথা বলুন','সানস্ক্রিন সাজেস্ট করো']];
function reply(t){for(const [re,a] of R){if(re.test(t.trim()))return a}return FB}
function send(t){if(busy||!t.trim())return;busy=true;s.disabled=true;me(t);q.value='';
 setTimeout(()=>{const k=think();const wait=1200+Math.random()*900;
  setTimeout(()=>{k.c.classList.remove('think');
   setTimeout(()=>{k.d.remove();const [a,ch2]=reply(t);bot(a,ch2);busy=false;s.disabled=false;q.focus()},380)},wait)},250)}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
</script>
</body></html>
